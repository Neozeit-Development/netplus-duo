name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security audit (fail on high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # --audit-level=high exits non-zero only for high or critical advisories,
      # so low/moderate findings are reported but do not fail the build.
      - run: npm audit --audit-level=high
        working-directory: frontend

  lint-test-build:
    name: Lint, test, build, Flask smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Smoke test Flask serves the SPA
        run: |
          python3 -c "
          from app import app, DIST_DIR
          assert (DIST_DIR / 'index.html').is_file(), 'dist/index.html missing after build'
          client = app.test_client()
          r = client.get('/')
          assert r.status_code == 200, r.status_code
          assert b'root' in r.data or b'NetPlus' in r.data
          r = client.get('/lesson/intro')
          assert r.status_code == 200, r.status_code
          "

<!-- @dsCard group="Screens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stats</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat">🔥 <span>13</span></div>
  <div class="header-stat"><span>♥♥♥♡♡</span></div>
  <div class="header-stat">Level <span>5</span></div>
  <div class="header-stat">XP: <span>10</span>/<span>100</span></div>
</header>

<main id="app-root">
  <section id="screen-stats" class="screen">
    <h2>📊 Your Stats</h2>
    <div class="stats-grid">
      <div class="stats-card"><span class="stats-num">13</span><span class="stats-label">Current Streak</span></div>
      <div class="stats-card"><span class="stats-num">21</span><span class="stats-label">Longest Streak</span></div>
      <div class="stats-card"><span class="stats-num">5</span><span class="stats-label">Level</span></div>
      <div class="stats-card"><span class="stats-num">410</span><span class="stats-label">Total XP</span></div>
      <div class="stats-card"><span class="stats-num">3/5</span><span class="stats-label">Hearts</span></div>
      <div class="stats-card"><span class="stats-num">17</span><span class="stats-label">Cards in Review</span></div>
    </div>
    <button class="btn btn-secondary btn-lg">Back</button>
  </section>
</main>

</body>
</html>

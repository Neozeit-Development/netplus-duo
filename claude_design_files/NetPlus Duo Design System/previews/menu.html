<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat" id="stat-streak">🔥 <span id="streak-value">12</span></div>
  <div class="header-stat" id="stat-hearts"><span id="hearts-display">♥♥♥♥♡</span></div>
  <div class="header-stat" id="stat-level">Level <span id="level-value">4</span></div>
  <div class="header-stat" id="stat-xp">XP: <span id="xp-value">40</span>/<span id="xp-next-value">100</span></div>
</header>

<main id="app-root">
  <section id="screen-menu" class="screen">
    <h1 class="app-title">NetPlus Duo</h1>
    <p class="app-subtitle">Study your way to the Network+ cert</p>
    <div class="menu-buttons">
      <button class="btn btn-primary btn-lg" id="btn-play">🔥 Play Daily Lesson</button>
      <button class="btn btn-secondary btn-lg" id="btn-study">📚 Study Guide</button>
      <button class="btn btn-secondary btn-lg" id="btn-weak">🎯 Weak Areas</button>
      <button class="btn btn-secondary btn-lg" id="btn-exam">📝 Practice Exam</button>
      <button class="btn btn-secondary btn-lg" id="btn-stats">📊 Stats</button>
      <button class="btn btn-secondary btn-lg" id="btn-settings">⚙️ Settings</button>
    </div>
  </section>
</main>

</body>
</html>

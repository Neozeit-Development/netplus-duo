<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lesson Summary</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat">🔥 <span>13</span></div>
  <div class="header-stat"><span>♥♥♥♡♡</span></div>
  <div class="header-stat">Level <span>5</span></div>
  <div class="header-stat">XP: <span>10</span>/<span>100</span></div>
</header>

<main id="app-root">
  <section id="screen-summary" class="screen">
    <h2>Lesson Complete!</h2>
    <div class="summary-stats">
      <div class="summary-stat">✅ Correct: 8</div>
      <div class="summary-stat">❌ Wrong: 2</div>
      <div class="summary-stat">⭐ XP earned: 80</div>
      <div class="summary-stat">🔥 Streak: 13 days</div>
    </div>
    <div class="summary-levelup">🎉 Level Up! You're now Level 5</div>
    <button class="btn btn-primary btn-lg">Done</button>
  </section>
</main>

</body>
</html>

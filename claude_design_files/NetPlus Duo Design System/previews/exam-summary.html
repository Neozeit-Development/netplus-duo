<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice Exam — Summary</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat">🔥 <span>12</span></div>
  <div class="header-stat"><span>♥♥♥♥♡</span></div>
  <div class="header-stat">Level <span>4</span></div>
  <div class="header-stat">XP: <span>40</span>/<span>100</span></div>
</header>

<main id="app-root">
  <section id="screen-exam-summary" class="screen">
    <h2>Exam Submitted</h2>
    <div class="exam-result-banner exam-pass">
      <span class="exam-result-pct">84%</span>
      <span class="exam-result-label">PASS</span>
    </div>
    <div class="summary-stats">
      <div class="summary-stat">✅ Correct: 76</div>
      <div class="summary-stat">❌ Wrong: 14</div>
      <div class="summary-stat">📄 Total: 90</div>
    </div>
    <h3 class="study-breadcrumb">By Domain</h3>
    <div class="exam-domain-breakdown">
      <div class="exam-domain-row"><span>Networking Concepts</span><span>18/21</span></div>
      <div class="exam-domain-row"><span>Network Implementation</span><span>15/18</span></div>
      <div class="exam-domain-row"><span>Network Operations</span><span>14/17</span></div>
      <div class="exam-domain-row"><span>Network Security</span><span>10/13</span></div>
      <div class="exam-domain-row"><span>Network Troubleshooting</span><span>19/21</span></div>
    </div>
    <button class="btn btn-primary btn-lg">Done</button>
  </section>
</main>

</body>
</html>

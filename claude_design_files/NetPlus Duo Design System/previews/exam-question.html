<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Practice Exam — Question</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat">🔥 <span>12</span></div>
  <div class="header-stat"><span>♥♥♥♥♡</span></div>
  <div class="header-stat">Level <span>4</span></div>
  <div class="header-stat">XP: <span>40</span>/<span>100</span></div>
</header>

<main id="app-root">
  <section id="screen-exam" class="screen">
    <div class="exam-topbar">
      <div class="exam-timer">64:12</div>
      <button class="btn btn-text">Quit</button>
    </div>
    <div class="lesson-progress">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" style="width: 27%;"></div>
      </div>
    </div>

    <div class="question-card">
      <p class="question-meta">Question 25 of 90</p>
      <h2 class="question-text">What port does DNS use for zone transfers between authoritative name servers?</h2>
      <div class="options-grid">
        <button class="option-btn">UDP 53</button>
        <button class="option-btn selected">TCP 53</button>
        <button class="option-btn">TCP 443</button>
        <button class="option-btn">UDP 161</button>
      </div>
    </div>

    <div class="exam-nav">
      <button class="btn btn-secondary btn-lg">Previous</button>
      <button class="btn btn-primary btn-lg">Next</button>
    </div>
  </section>
</main>

</body>
</html>

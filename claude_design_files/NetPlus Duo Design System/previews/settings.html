<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<header class="app-header">
  <div class="header-stat">🔥 <span>13</span></div>
  <div class="header-stat"><span>♥♥♥♡♡</span></div>
  <div class="header-stat">Level <span>5</span></div>
  <div class="header-stat">XP: <span>10</span>/<span>100</span></div>
</header>

<main id="app-root">
  <section id="screen-settings" class="screen">
    <h2>⚙️ Settings</h2>
    <div class="settings-list">
      <label class="settings-row">
        <span>Username</span>
        <input type="text" value="David" placeholder="Your name">
      </label>
      <button class="btn btn-danger btn-lg">Reset All Progress</button>
    </div>
    <button class="btn btn-secondary btn-lg">Back</button>
  </section>
</main>

</body>
</html>
